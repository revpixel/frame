<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>FRAME</title>
		<link rel="icon" href="../icons/icon-32.png" />
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="result.css" />
		<script type="module" src="result.js"></script>
	</head>
	<body>
		<header class="bar">
			<div class="left">
				<span class="brand">FRAME</span>
				<span class="info mono" id="info"></span>
			</div>

			<div class="tools" id="tools">
				<button class="btn ghost" id="crop" type="button" title="Crop (C)">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14" /></svg>Crop
				</button>
				<button class="btn ghost" id="redact" type="button" title="Redact (R)">
					<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="1.5" fill="currentColor" stroke="none" opacity=".85" /><path d="M3 4h18M3 20h12" /></svg>Redact
				</button>
				<button class="btn ghost" id="annotate" type="button" title="Annotate (A)">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20z" /><path d="M13.5 7.5l3 3" /></svg>Annotate
				</button>
				<button class="btn ghost" id="undo" type="button" title="Undo (Ctrl+Z)" disabled>
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>Undo
				</button>
				<button class="btn ghost" id="zoom" type="button" title="Toggle fit / actual size (Z)">
					<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3M8 11h6M11 8v6" /></svg><span>100%</span>
				</button>
			</div>

			<div class="out">
				<button class="btn" id="copy" type="button" title="Copy to clipboard (Ctrl+C)">
					<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" /></svg>Copy
				</button>
				<div class="save">
					<button class="btn primary" id="save" type="button" title="Save (Ctrl+S)">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" /></svg>Save
					</button>
					<select id="format" aria-label="Format">
						<option value="png">PNG</option>
						<option value="jpeg">JPEG</option>
						<option value="webp">WebP</option>
					</select>
				</div>
				<button class="btn" id="save-all" type="button" hidden>Save all parts</button>
			</div>
		</header>

		<div class="editbar" id="editbar" hidden>
			<span class="hint" id="edit-hint"></span>
			<span class="redact-style" id="redact-style" hidden>
				<label><input type="radio" name="rstyle" value="solid" checked /> Solid</label>
				<label><input type="radio" name="rstyle" value="pixelate" /> Pixelate</label>
			</span>
			<span class="annot" id="annot" hidden>
				<span class="seg" id="shapes" role="group" aria-label="Annotation tool">
					<button type="button" data-shape="arrow" title="Arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5m0 0h-8m8 0v8" /></svg>Arrow</button>
					<button type="button" data-shape="rect" title="Rectangle"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1" /></svg>Rectangle</button>
					<button type="button" data-shape="pen" title="Freehand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17c3-6 5-9 7-9 3 0-1 9 2 9 2 0 4-4 5-6s2-3 4-3" /></svg>Freehand</button>
					<button type="button" data-shape="text" title="Text"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6" /></svg>Text</button>
					<button type="button" data-shape="highlight" title="Highlight"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="1" fill="currentColor" stroke="none" opacity=".35" /><path d="M3 20h18" /></svg>Highlight</button>
				</span>
				<span class="swatches" id="colors" role="group" aria-label="Colour">
					<button type="button" data-color="#ef4444" style="--c: #ef4444" title="Red"></button>
					<button type="button" data-color="#facc15" style="--c: #facc15" title="Yellow"></button>
					<button type="button" data-color="#3b82f6" style="--c: #3b82f6" title="Blue"></button>
					<button type="button" data-color="#22c55e" style="--c: #22c55e" title="Green"></button>
					<button type="button" data-color="#ffffff" style="--c: #ffffff" title="White"></button>
					<button type="button" data-color="#000000" style="--c: #000000" title="Black"></button>
					<label class="custom" title="Other colour"><input type="color" id="color-custom" value="#a78bfa" aria-label="Other colour" /></label>
				</span>
				<span class="seg small" id="widths" role="group" aria-label="Stroke width">
					<button type="button" data-width="2" title="Thin"><i style="height: 2px"></i></button>
					<button type="button" data-width="4" title="Medium"><i style="height: 4px"></i></button>
					<button type="button" data-width="8" title="Thick"><i style="height: 7px"></i></button>
				</span>
				<span class="seg small" id="sizes" role="group" aria-label="Text size" hidden>
					<button type="button" data-size="16" title="Small text">S</button>
					<button type="button" data-size="24" title="Medium text">M</button>
					<button type="button" data-size="36" title="Large text">L</button>
				</span>
			</span>
			<span class="spacer"></span>
			<button class="btn primary" id="annot-done" type="button" hidden>Done <kbd>Esc</kbd></button>
			<button class="btn ghost" id="edit-cancel" type="button">Cancel <kbd>Esc</kbd></button>
			<button class="btn primary" id="edit-apply" type="button" disabled>Apply <kbd>Enter</kbd></button>
		</div>

		<nav class="parts" id="parts" hidden></nav>
		<p class="notice" id="notice" hidden></p>

		<main class="stage" id="stage">
			<div class="frame" id="frame">
				<canvas id="view"></canvas>
				<div class="overlay" id="overlay"></div>
				<canvas class="preview" id="preview" aria-hidden="true"></canvas>
			</div>
			<p class="empty" id="empty" hidden></p>
		</main>

		<div class="toast" id="toast" role="status" aria-live="polite"></div>
	</body>
</html>
