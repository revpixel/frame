<!doctype html>
<html><head><meta charset="utf-8"><title>Inner scroller</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; }
#top { position: absolute; top: 0; left: 0; right: 0; height: 80px; background: #ff00ff; }
#side { position: absolute; top: 80px; left: 0; bottom: 0; width: 120px; background: #222; }
#scroller { position: absolute; top: 80px; left: 120px; right: 0; bottom: 0; overflow-y: auto; scroll-behavior: smooth; }
</style>
<script src="bands.js"></script>
</head><body>
<div id="top"></div><div id="side"></div>
<div id="scroller"></div>
<script>makeBands(scroller, 30, 200);</script>
</body></html>
