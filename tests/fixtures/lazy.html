<!doctype html>
<html><head><meta charset="utf-8"><title>Lazy</title>
<style>
body { margin: 0; }
img { display: block; width: 100%; height: 400px; }
.io { height: 400px; background: #808080; }
</style>
</head><body>
<script>
// Native lazy images, served with a delay.
for (let i = 0; i < 6; i++) document.write(`<img loading="lazy" src="/img?c=${["ff0000","00ff00","0000ff","ff8800","8800ff","00ff88"][i]}&delay=250">`);
// Scroll-triggered content (IntersectionObserver), like infinite feeds.
for (let i = 0; i < 6; i++) document.write(`<div class="io" data-c="${["#ff4040","#40ff40","#4040ff","#ffd040","#d040ff","#40ffd0"][i]}"></div>`);
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.style.background = e.target.dataset.c; io.unobserve(e.target); } }));
document.querySelectorAll(".io").forEach((d) => io.observe(d));
</script>
</body></html>
