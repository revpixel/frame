name: 🐛 Bug report
description: A capture, the result viewer, saving or copying doesn't work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem! A few details make it much quicker to track down.

        **Before you start:**
        - FRAME's settings page has **Copy diagnostic info** (Settings → About). It copies FRAME's version, your browser and OS, your settings and a summary of the last capture. It never includes URLs, page titles or page content. Pasting it below is the single most useful thing you can add.
        - Chrome doesn't let any extension run on `chrome://` pages, the Chrome Web Store or other extensions' pages. That's a browser rule, not a bug (see [Limits](https://github.com/revpixel/frame#limits)).
        - Screenshots can contain private information. **Redact anything sensitive** before attaching one (FRAME's Redact tool works well for this).

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the problem happen?
      options:
        - Full page capture
        - Select area
        - Visible capture
        - Capture delay / countdown
        - Result viewer (crop, redact, annotate, undo)
        - Copy to clipboard
        - Saving (PNG, JPEG, WebP, filenames, save dialog)
        - Settings or keyboard shortcuts
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step.
      placeholder: |
        1. Open a page that ...
        2. Click FRAME → Full page
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: For a capture problem, describe what's wrong in the image (repeated header, missing section, blank area, wrong size...). Include any error message, or the toolbar icon's tooltip if it showed "!".
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page that shows it (optional)
      description: A public URL that reproduces the problem, only if you're comfortable sharing it. Many capture bugs depend on how a specific site is built.
      placeholder: "https://example.com/some/page"

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic info
      description: Settings → About → **Copy diagnostic info**, then paste here. It's shown as code automatically, so no backticks needed.
      render: text
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots (redacted), screen recordings, or anything else that might help.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this hasn't been reported yet.
          required: true
        - label: Anything I attached has sensitive information redacted.
          required: true
