name: Feature request
description: Suggest something FRAME should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: FRAME is deliberately small. Requests that keep it a fast, local screenshot utility are the most likely to land.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
